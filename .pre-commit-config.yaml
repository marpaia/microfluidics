repos:
  - repo: local
    hooks:
      - id: rust-imports
        name: rust import layout
        entry: python3 scripts/check_imports.py
        language: system
        types: [rust]
        pass_filenames: false
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all -- --check
        language: system
        types: [rust]
        pass_filenames: false
      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --workspace --all-targets --all-features -- -D warnings
        language: system
        types_or: [rust, toml]
        pass_filenames: false
  - repo: https://github.com/PyCQA/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: [--profile, black, --line-length, "120"]
  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        args: [--line-length, "120"]
  - repo: https://github.com/PyCQA/flake8
    rev: 7.1.1
    hooks:
      - id: flake8
        args: [--max-line-length, "120", --extend-ignore, "E402,W503,E203,W605"]
        # One file is wrong on purpose: the typing tests hold the checker to refusing it.
        exclude: ^tests/typing/refuse\.py$
  # mypy runs from the project's own environment, where the package it checks is installed.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: mypy
        language: system
        types: [python]
        pass_filenames: false
