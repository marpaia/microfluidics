# A stand-in process for designs made before the real one is chosen: PDMS cast from a two-layer
# SU-8 master and bonded to glass. Every number is a cautious rule of thumb, not a vendor's or a
# cleanroom's design rule. Replace this file with the real process before ordering masks.
name = "conservative-su8-pdms"
description = "Placeholder two-layer SU-8 master and PDMS process. Unconfirmed rule-of-thumb limits; replace before ordering masks."

# The smallest width of a feature, and of the wall between two features, on any mask.
[[rules]]
name = "feature.width"
kind = "width"
min_um = 1.0

[[rules]]
name = "feature.space"
kind = "space"
min_um = 2.0

# How far one mask layer may sit from another after alignment. A shallow feature that opens
# into a deeper one is drawn this far into it.
[[rules]]
name = "layer.overlap"
kind = "overlap"
min_um = 3.0

# The tallest feature, or wall between features, relative to its width that the resist holds.
[[rules]]
name = "resist.aspect"
kind = "aspect"
max = 2.0

# The widest unsupported PDMS roof relative to its height before it sags onto the glass. A
# punched hole removes the roof it passes through.
[[rules]]
name = "roof.span"
kind = "roof_span"
max = 12.0
punch_um = 750.0

# How close two ports, and a port and the chip's edge, may be.
[[rules]]
name = "port.pitch"
kind = "port_pitch"
min_um = 2500.0

[[rules]]
name = "port.edge"
kind = "edge_margin"
min_um = 2000.0

# The glass the chip is bonded to.
[[rules]]
name = "chip.size"
kind = "extent"
max_mm = [50.0, 24.0]

# The layer heights the process can spin, and how many layers it builds.
[[rules]]
name = "layer.height"
kind = "layer_height"
min_um = 0.8
max_um = 100.0

[[rules]]
name = "layer.count"
kind = "layer_count"
max = 2

# How far a made chip may be from its drawing, each as one standard deviation: the width of each
# feature on its own, the width of every feature of a layer together, and a layer's height.
[tolerances]
width_sigma_um = 0.3
width_bias_sigma_um = 0.5
height_sigma_fraction = 0.05

# How each layer's mask is made from its drawing. Both are clear inside the outlines, for a
# negative resist, and are written as drawn, with no bias.
[[masks]]
layer = "trench"
tone = "clear"
mirror = false
bias_um = 0.0

[[masks]]
layer = "flow"
tone = "clear"
mirror = false
bias_um = 0.0

# How masks print: the exposure is the mask blurred by this much, and resist stays where it
# passes the threshold. These are not measurements of any process.
[print]
blur_um = 0.4
threshold = 0.5
tolerance_um = 0.1
calibrated = false
