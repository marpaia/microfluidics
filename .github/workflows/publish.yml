name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check the release version
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          tag = os.environ["GITHUB_REF_NAME"]
          python_version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          rust_version = tomllib.loads(Path("Cargo.toml").read_text())["workspace"]["package"]["version"]
          if tag != f"v{python_version}" or python_version != rust_version:
              raise SystemExit(f"Release tag {tag!r}, Python version {python_version!r}, and Rust version {rust_version!r} must agree")
          PY

  ci:
    needs: version
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: python-dist-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
