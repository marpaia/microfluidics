name: Python distributions

on:
  workflow_call:

permissions:
  contents: read

jobs:
  wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: PyO3/maturin-action@v1
        with:
          maturin-version: "1.16.0"
          target: ${{ matrix.target }}
          manylinux: "2_28"
          args: --release --locked --out dist -i ${{ runner.os == 'Linux' && 'python3.11' || 'python' }}
      - name: Check and install the wheel
        shell: bash
        run: |
          python -m pip install twine
          python -m twine check --strict dist/*.whl
          python -m pip install --no-index dist/*.whl
          python -I scripts/check_install.py
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error
          overwrite: true

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build and check the source distribution
        run: |
          python -m pip install 'maturin>=1.16,<2' twine
          maturin sdist --out dist
          python -m twine check --strict dist/*.tar.gz
      - name: Install from the source distribution
        run: |
          python -m pip install dist/*.tar.gz
          python -I scripts/check_install.py
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist-sdist
          path: dist/*.tar.gz
          if-no-files-found: error
          overwrite: true
