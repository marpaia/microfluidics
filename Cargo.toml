[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.95"
publish = false
license = "MIT"

[workspace.dependencies]
microfluidics-core = { path = "crates/microfluidics-core" }
microfluidics-layout = { path = "crates/microfluidics-layout" }
microfluidics-network = { path = "crates/microfluidics-network" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
# RFC 8785 canonical JSON, so that a value's hash does not depend on how it was written.
serde_json_canonicalizer = "0.3"
tempfile = "3"
toml = "0.8"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# Library code returns errors; it does not stop the program.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "warn"
todo = "deny"
unimplemented = "deny"
