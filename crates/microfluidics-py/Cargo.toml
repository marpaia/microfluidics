[package]
name = "microfluidics-py"
description = "The engine as a Python extension module: bindings only"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# PyO3's macros expand to `unsafe` blocks, which the workspace forbids outright; this crate
# denies it in its own code instead, and otherwise keeps the workspace's lints.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "warn"
todo = "deny"
unimplemented = "deny"

[lib]
name = "_engine"
crate-type = ["cdylib"]

[dependencies]
microfluidics-core = { workspace = true }
microfluidics-layout = { workspace = true }
microfluidics-network = { workspace = true }
pyo3 = { version = "0.30", features = ["abi3-py311"] }
serde_json = { workspace = true }
