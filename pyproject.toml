[build-system]
requires = ["maturin>=1.16,<2"]
build-backend = "maturin"

[project]
name = "microfluidics"
version = "0.0.1"
description = "Design, verify, and export microfluidic chips using typed Python"
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Repository = "https://github.com/marpaia/microfluidics"

[project.scripts]
microfluidics = "microfluidics.cli:main"

[tool.maturin]
manifest-path = "crates/microfluidics-py/Cargo.toml"
module-name = "microfluidics._engine"
python-source = "python"
features = ["pyo3/extension-module"]
include = [
    { path = "processes/*.toml", format = "sdist" },
    { path = "rust-toolchain.toml", format = "sdist" },
]
exclude = ["**/__pycache__/**", "**/*.pyc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["klayout: needs KLayout's Python module, named by KLAYOUT_PYTHON"]

[tool.mypy]
strict = true
# Each benchmark's `conditions.py` is checked on its own: they share a module name.
files = ["python", "designs", "tests"]
mypy_path = "python:tests"
# One file is wrong on purpose: the typing tests hold the checker to refusing it.
exclude = ["tests/typing/refuse\\.py$"]

[tool.pyright]
include = ["python", "designs", "benchmarks", "tests"]
exclude = ["tests/typing/refuse.py", ".venv"]
extraPaths = ["python", "tests"]

[tool.black]
line-length = 120

[tool.isort]
profile = "black"
line_length = 120
